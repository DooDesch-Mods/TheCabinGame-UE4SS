name: Check upstream
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-candidate
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Check upstream selection guards
        run: python -m unittest discover -s tests -v
      - name: Find and check a new basic candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/distribution.py candidate
      - uses: actions/upload-artifact@v7.0.2
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: ue4ss-upstream-candidate
          path: dist/candidate/*
          if-no-files-found: error
